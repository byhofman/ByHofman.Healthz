name: publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:Version=$VERSION -o "$RUNNER_TEMP/pkg"
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "$RUNNER_TEMP/pkg/*.nupkg"
          --source "https://nuget.pkg.github.com/byhofman/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
